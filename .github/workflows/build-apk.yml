name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The release build needs a private keystore, so we build the debug
      # variant, which is signed with the repo's debug.keystore and installs fine.
      - name: Build debug APK
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew :app:assembleGoogleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/google/debug/*.apk
