name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Apply no-proxy experiment and rename
        run: |
          git apply no-proxy.patch
          sed -i 's|<string name="app_name">TetherFuseNet</string>|<string name="app_name">WiFi Share</string>|' app/src/main/res/values/strings.xml

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew :app:assembleGoogleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/google/debug/*.apk
